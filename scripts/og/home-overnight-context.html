<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>OG source — home-overnight-context (v5)</title>
<!--
2026-09-04(TASK_ID=HOMEPAGE_NARRATIVE_PULSE_VALUES_AND_CALENDAR_KO §3)
og-home-editorial-3lines-v4.png(이전 "3줄로" 훅)를 대체하는 새 OG 원본.
이전 파일은 삭제하지 않고 그대로 둔다 — 이건 별도 새 산출물
(og-home-overnight-context-v5.png)을 만드는 별도 소스다.
scripts/generate_og_home.py --v5 가 이 파일을 1200x630으로 스크린샷한다.
폰트 출처/라이선스: ../../assets/fonts/og/OFL-*.txt(Fraunces·IBM Plex
Sans KR·Noto Serif KR, 전부 Google Fonts OFL 1.1) — 이번 문구에 필요한
글자만 fontTools.subset으로 다시 잘라냈다(재현 절차는
scripts/generate_og_home.py 상단 주석 참고).
-->
<style>
  @font-face { font-family: 'Fraunces OG'; src: url('../../assets/fonts/og/Fraunces-ExtraBold-subset.ttf') format('truetype'); font-weight: 800; }
  @font-face { font-family: 'Noto Serif KR OG'; src: url('../../assets/fonts/og/NotoSerifKR-Bold-subset.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'IBM Plex Sans KR OG'; src: url('../../assets/fonts/og/IBMPlexSansKR-Regular-subset.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Sans KR OG'; src: url('../../assets/fonts/og/IBMPlexSansKR-SemiBold-subset.ttf') format('truetype'); font-weight: 600; }

  :root {
    --bg: #EFEAD9; --ink: #1A1613; --rule-dark: #3A2D18;
    --gold: #9E6A15; --muted: #6B5B44; --rule-light: #C9B98A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: var(--bg); font-family: 'IBM Plex Sans KR OG', sans-serif; }
  .canvas { width: 1200px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .label { position: absolute; top: 50px; left: 90px; right: 90px; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: 0.18em; color: var(--muted); }
  .rule-top { position: absolute; top: 87px; left: 150px; right: 150px; height: 1px; background: var(--rule-light); }
  .rule-top::before { content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 3px; background: var(--rule-dark); }
  .wordmark { font-family: 'Fraunces OG', serif; font-weight: 800; font-size: 58px; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 24px; }
  .hook { font-family: 'Noto Serif KR OG', serif; font-weight: 700; font-size: 39px; letter-spacing: -0.015em; color: var(--ink); text-align: center; line-height: 1.32; }
  .hook .gold { color: var(--gold); }
  .method { margin-top: 22px; font-size: 16px; letter-spacing: 0.03em; color: var(--muted); text-align: center; }
  .method b { color: var(--gold); font-weight: 600; }
  .rule-bottom { position: absolute; bottom: 87px; left: 150px; right: 150px; height: 1px; background: var(--rule-light); }
  .pubinfo { position: absolute; bottom: 50px; left: 90px; right: 90px; text-align: center; font-size: 16px; color: var(--muted); }
  .url { position: absolute; bottom: 22px; left: 90px; right: 90px; text-align: center; font-size: 12px; color: var(--rule-light); letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="canvas">
  <div class="label">DAILY MOO:CONOMY &middot; ECONOMIC NEWSLETTER</div>
  <div class="rule-top"></div>
  <div class="wordmark">MOO:conomy</div>
  <div class="hook">잠든 사이 움직인 시장과 뉴스를 모아,<br>오늘 아침의 <span class="gold">맥락</span>으로 연결합니다</div>
  <div class="method">COLLECT &middot; CONNECT &middot; CONDENSE &nbsp;<b>모으고 &middot; 잇고 &middot; 핵심 3줄로</b></div>
  <div class="rule-bottom"></div>
  <div class="pubinfo">월 Weekly &middot; 화&ndash;토 Daily &middot; 오전 7시</div>
  <div class="url">mooconomy.co.kr</div>
</div>
</body>
</html>
