<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Mooconomy - Weekly Report (베타)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root {
    --navy: #0b2545;
    --gold: #f5b301;
    --navy-light: #134074;
    --bg-gray: #f5f6f8;
    --border-gray: #e3e6ea;
    --up-red: #d32f2f;
    --down-blue: #1565c0;
    --nav-h: 70px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    background: var(--bg-gray);
    color: #222;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    padding-bottom: 0;
  }

  /* ── GNB 네비게이션(markets.html과 동일 구조, 참고만 — markets.html 파일 자체는 미수정) ── */
  .nav {
    height: var(--nav-h);
    background: rgba(11, 37, 69, 0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .nav .logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; z-index: 2; }
  .nav .logo-wrap img { width: 30px; }
  .nav .logo-wrap .nm { color: #fff; font-weight: 800; font-size: 16px; }
  .nav .logo-wrap .nm .moo { color: var(--gold); }
  .nav ul {
    list-style: none;
    display: flex;
    gap: 40px;
    align-items: center;
    position: absolute;
    left: 50%;
    top: 0;
    height: var(--nav-h);
    transform: translateX(-50%);
  }
  .nav ul a {
    color: #c8d3e0;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    transition: 0.2s;
    padding: 6px 0;
    border-bottom: 2px solid transparent;
  }
  .nav ul a:hover { color: #fff; }
  .nav ul a.active { color: var(--gold); border-bottom-color: var(--gold); }
  .nav .nav-cta {
    background: var(--gold);
    color: var(--navy);
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: .5px;
    text-decoration: none;
    z-index: 2;
    border: 0;
  }

  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 62px;
    background: rgba(11, 37, 69, 0.98);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 1000;
    align-items: center;
    justify-content: space-around;
    padding: 0 10px;
  }
  .mobile-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #a8b2c1;
    text-decoration: none;
    font-size: 9px;
    font-weight: 700;
    gap: 4px;
    flex: 1;
    height: 100%;
  }
  .mobile-nav-item.active { color: var(--gold); }
  .mobile-nav-item i { width: 20px; height: 20px; }

  .container {
    max-width: 1040px;
    margin: 30px auto 60px;
    padding: 0 20px;
  }

  .db-header { margin-bottom: 20px; }
  .db-header .beta-tag {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .5px;
    padding: 3px 8px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .db-header h1 { font-size: 22px; font-weight: 800; color: var(--navy); }
  .db-header p { font-size: 13px; color: #666; margin-top: 4px; }

  /* ── 주간 목록 ── */
  .week-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .week-chip {
    background: #fff;
    border: 1px solid var(--border-gray);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    text-decoration: none;
    cursor: pointer;
  }
  .week-chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ── 상세 카드 ── */
  .card {
    background: #fff;
    border: 1px solid var(--border-gray);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.03);
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .card .sub { font-size: 12px; color: #8a94a3; margin-bottom: 16px; }

  /* 정보 계층: 제목 > 기간 > 주간 변화 > 주요 이슈 > 다음 주 관찰 */
  .period-line {
    font-size: 13.5px;
    color: #444;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .period-line b { color: var(--navy); }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .metric-item {
    background: var(--bg-gray);
    border: 1px solid var(--border-gray);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .metric-item .lbl { font-size: 11px; color: #666; font-weight: 700; text-transform: uppercase; }
  .metric-item .val { font-size: 18px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .metric-item .val.up { color: var(--up-red); }
  .metric-item .val.down { color: var(--down-blue); }
  .metric-item .range { font-size: 10.5px; color: #8a94a3; margin-top: 3px; }

  .empty-state {
    font-size: 13px;
    color: #8a94a3;
    font-style: normal;
    background: var(--bg-gray);
    border: 1px dashed var(--border-gray);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .source-list { list-style: none; }
  .source-list li {
    font-size: 12.5px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-gray);
  }
  .source-list li:last-child { border-bottom: none; }
  .source-list a { color: var(--navy-light); text-decoration: none; font-weight: 600; }
  .source-list a:hover { text-decoration: underline; }
  .source-list .src-date { color: #8a94a3; font-size: 11px; margin-right: 6px; }

  .footer {
    color: #8a94a3;
    font-size: 11px;
    border-top: 1px solid var(--border-gray);
    padding: 30px 20px;
    line-height: 1.6;
    text-align: center;
    background: #fff;
    margin-bottom: 60px;
  }
  .footer .sign { margin-top: 10px; font-size: 13px; letter-spacing: 1px; color: #5a6b82; }
  .footer .sign b { color: var(--navy); letter-spacing: 2px; }
  .footer .sign .moo { color: var(--gold); }

  @media (max-width: 640px) {
    body { padding-bottom: 62px; }
    .nav { height: 52px; padding: 0 16px; }
    .nav ul, .nav .nav-cta { display: none !important; }
    .mobile-nav { display: flex; }
    .container { margin: 16px auto 30px; padding: 0 12px; }
    .db-header h1 { font-size: 18px; }
    .db-header p { font-size: 11.5px; }
    .card { padding: 16px; border-radius: 10px; }
    .metric-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .metric-item { padding: 10px 12px; }
    .metric-item .val { font-size: 16px; }
  }
  @media (max-width: 360px) {
    .metric-grid { grid-template-columns: 1fr 1fr; }
    .db-header h1 { font-size: 16.5px; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <a class="logo-wrap" href="index.html">
      <img src="https://raw.githubusercontent.com/immusaeng/mooconomy-assets/main/bull-gold.png" alt="logo">
      <span class="nm">Daily <span class="moo">'Moo'</span>conomy</span>
    </a>
    <ul>
      <li><a href="index.html#problem">THE PROBLEM</a></li>
      <li><a href="index.html#why">THE 3C</a></li>
      <li><a href="markets.html">MARKETS</a></li>
      <li><a href="weekly.html" class="active">WEEKLY</a></li>
      <li><a href="index.html#latest">LATEST</a></li>
    </ul>
    <a class="nav-cta" href="index.html#subscribe">무료 구독하기</a>
  </nav>

  <nav class="mobile-nav">
    <a href="index.html" class="mobile-nav-item">
      <i data-lucide="home"></i>
      <span>홈</span>
    </a>
    <a href="markets.html" class="mobile-nav-item">
      <i data-lucide="line-chart"></i>
      <span>지표보드</span>
    </a>
    <a href="weekly.html" class="mobile-nav-item active">
      <i data-lucide="calendar-range"></i>
      <span>Weekly</span>
    </a>
    <a href="index.html#subscribe" class="mobile-nav-item">
      <i data-lucide="bell"></i>
      <span>무료구독</span>
    </a>
  </nav>

  <div class="container">

    <div class="db-header">
      <span class="beta-tag">BETA</span>
      <h1 id="pageTitle">Weekly Report</h1>
      <p>Daily 발행분을 결정론적으로 집계한 주간 리포트입니다. 서술형 분석은 아직 제공하지 않습니다.</p>
    </div>

    <div class="week-list" id="weekList"></div>

    <div id="detailContainer">
      <div class="empty-state">불러오는 중...</div>
    </div>

  </div>

  <footer class="footer">
    <div class="sign">Curated by <b>임무생</b> · © 2026 All rights reserved.</div>
  </footer>

  <script>
    const cardTpl = (report) => {
      const metrics = report.first_last_metrics || [];
      const metricsHtml = metrics.length ? `
        <div class="metric-grid">
          ${metrics.map(m => {
            const pct = m.weekly_change_percent;
            const dirClass = pct == null ? '' : (pct > 0 ? 'up' : (pct < 0 ? 'down' : ''));
            const pctText = pct == null ? '데이터 없음' : `${pct > 0 ? '▲' : (pct < 0 ? '▼' : '―')} ${Math.abs(pct).toFixed(2)}%`;
            return `
              <div class="metric-item">
                <div class="lbl">${escapeHtml(m.metric_id)}</div>
                <div class="val ${dirClass}">${pctText}</div>
                <div class="range">${escapeHtml(m.first_date_kst)} → ${escapeHtml(m.last_date_kst)}</div>
              </div>`;
          }).join('')}
        </div>
      ` : `<div class="empty-state">이번 주간에 집계 가능한 지표가 없습니다.</div>`;

      const drivers = report.top_three_drivers || [];
      const driversHtml = drivers.length
        ? `<ul class="source-list">${drivers.map(d => `<li>${escapeHtml(JSON.stringify(d))}</li>`).join('')}</ul>`
        : `<div class="empty-state">주요 이슈 데이터 없음(서사형 콘텐츠는 이번 라운드에 집계되지 않습니다).</div>`;

      const watch = report.next_week_watch || [];
      const watchHtml = watch.length
        ? `<ul class="source-list">${watch.map(w => `<li>${escapeHtml(JSON.stringify(w))}</li>`).join('')}</ul>`
        : `<div class="empty-state">다음 주 관찰 항목 데이터 없음.</div>`;

      const sources = report.source_manifest || [];
      const sourcesHtml = sources.length
        ? `<ul class="source-list">${sources.map(s => `
            <li><span class="src-date">${escapeHtml(s.edition_date_kst || '')}</span>
            <a href="${escapeAttr(s.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.source_name || s.source_url)}</a></li>
          `).join('')}</ul>`
        : `<div class="empty-state">출처 없음(이번 주간 자동 편입 원본에 콘텐츠가 없습니다).</div>`;

      const vs = report.validation_status || {};

      return `
        <div class="card">
          <h2>주간 리포트 · ${escapeHtml(report.week_id)}</h2>
          <div class="period-line">기간: <b>${escapeHtml(report.period_start_kst)} ~ ${escapeHtml(report.period_end_kst)}</b>
            &nbsp;·&nbsp; 집계 대상 Daily ${vs.eligible_daily_count ?? 0}건(전체 ${vs.total_daily_count ?? 0}건 중, tombstone 제외)</div>
        </div>

        <div class="card">
          <h2>주간 변화</h2>
          <div class="sub">canonical_status=production인 Daily만 집계 — 결측치는 0으로 채우지 않고 제외합니다.</div>
          ${metricsHtml}
        </div>

        <div class="card">
          <h2>주요 이슈</h2>
          ${driversHtml}
        </div>

        <div class="card">
          <h2>다음 주 관찰</h2>
          ${watchHtml}
        </div>

        <div class="card">
          <h2>출처(Source Manifest)</h2>
          ${sourcesHtml}
        </div>
      `;
    };

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s) {
      if (!s || !/^https?:\/\//.test(s)) return '#';
      return escapeHtml(s);
    }

    async function loadWeek(weekId, weeks) {
      const container = document.getElementById('detailContainer');
      try {
        const res = await fetch(`data/weekly/${encodeURIComponent(weekId)}.json?v=` + Date.now());
        if (!res.ok) throw new Error('fetch failed: ' + res.status);
        const report = await res.json();
        container.innerHTML = cardTpl(report);
        document.getElementById('pageTitle').textContent = `Weekly Report · ${report.week_id}`;
      } catch (err) {
        console.warn('[weekly] 데이터 로드 실패:', err);
        container.innerHTML = `<div class="card"><div class="empty-state">이번 주 리포트를 불러올 수 없습니다. 아직 집계되지 않았을 수 있습니다.</div></div>`;
      }
      renderWeekList(weeks, weekId);
    }

    function renderWeekList(weeks, activeId) {
      const el = document.getElementById('weekList');
      el.innerHTML = weeks.map(w => `
        <a class="week-chip ${w.week_id === activeId ? 'active' : ''}" href="weekly.html#${encodeURIComponent(w.week_id)}">
          ${escapeHtml(w.week_id)}
        </a>
      `).join('');
    }

    async function init() {
      let weeks = [];
      try {
        const res = await fetch('data/weekly/index.json?v=' + Date.now());
        if (!res.ok) throw new Error('index fetch failed: ' + res.status);
        const idx = await res.json();
        weeks = idx.weeks || [];
      } catch (err) {
        console.warn('[weekly] 목록 로드 실패:', err);
        document.getElementById('detailContainer').innerHTML =
          `<div class="card"><div class="empty-state">Weekly 목록을 불러올 수 없습니다.</div></div>`;
        return;
      }
      if (!weeks.length) {
        document.getElementById('detailContainer').innerHTML =
          `<div class="card"><div class="empty-state">아직 집계된 Weekly 리포트가 없습니다.</div></div>`;
        return;
      }
      const hashWeek = decodeURIComponent(window.location.hash.replace('#', ''));
      const target = weeks.find(w => w.week_id === hashWeek) ? hashWeek : weeks[0].week_id;
      loadWeek(target, weeks);
    }

    window.addEventListener('hashchange', () => {
      init();
    });

    window.onload = () => {
      init();
      try { lucide.createIcons(); } catch (e) { console.warn('[아이콘] lucide 로드 실패:', e); }
    };
  </script>
</body>
</html>
